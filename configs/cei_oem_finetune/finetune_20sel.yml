# Few-shot fine-tune of the OEM-trained U-Net+EfficientNet-B4 on 20 CEI tiles,
# every one of which contains at least 6 of the 7 CEI classes (each >= 1% of
# the tile's labelled pixels).
#
#   python train.py --config configs/cei_oem_finetune/finetune_20sel.yml \
#       --init-weights experiments/cei_oem_m2_unet_effb4/checkpoints/best_checkpoint.pth
#
# Tile selection -- builds on the 15-tile round (train_10sel.txt):
#   kept  (8)  maesuai_10, 24, 31, 32, 39, 41, 82, 88  -- the 15sel tiles that pass
#   dropped(7) maesuai_25, 35, 37, 50, 76, 92, 93       -- fewer than 6 classes
#   added (12) maesuai_9, 27, 29, 30, 34, 44, 56, 66, 67, 68, 74, 81
# The 12 added tiles were picked greedily from the passing, non-val tiles: each
# next tile is the one farthest (in per-class pixel-share space) from those
# already chosen -- the same diversity rule as tools/cei/build_finetune_splits.py.
#
# Splits (all three disjoint):
#   train  finetune_splits/train_20sel.txt        20 tiles, each repeated 10x
#   val    finetune_splits/val.txt                14 tiles, early stopping only
#   test   finetune_splits/test_20sel_strict.txt  64 tiles = test_split.txt
#                                                  minus val minus these 20
#
# The 7 dropped 15sel tiles are now in the test set, so the 15sel checkpoint
# is NOT a fair comparison on test_20sel_strict -- it trained on them.
experiment:
  name: cei_finetune_20sel
  output_dir: ./experiments/cei_finetune_20sel
dataset:
  name: CEI
  root: data/CEI_data
  image_dir: images
  mask_dir: masks
  train_split: finetune_splits/train_20sel.txt
  val_split: finetune_splits/val.txt
  test_split: finetune_splits/test_20sel_strict.txt
  label_map: cei              # CEI ids 1-7 -> classes 0-6; on-disk 0 -> ignore
  crop_size: 512
  num_classes: 7
  ignore_index: 255
  normalization: imagenet     # must match the OEM checkpoint being warm-started
  augment: true               # flip/rot90; matters more than usual with few tiles
  eval_mode: full             # full-tile validation, same protocol as the test
model:
  name: unet
  encoder_name: efficientnet-b4
  encoder_weights: imagenet   # ignored: --init-weights forces this to null
  in_channels: 3
  num_classes: 7
training:
  batch_size: 8
  epochs: 40                  # ceiling; early stopping normally ends it sooner
  learning_rate: 0.00001      # 1e-5, low LR for warm-started fine-tuning
  optimizer: AdamW
  weight_decay: 0.000001
  loss: cross_entropy
  scheduler: none
  mix_precision: true
  num_workers: 0              # avoids the Windows full-image-val OOM seen elsewhere
  early_stopping_patience: 15 # stop if val mIoU hasn't improved in 15 epochs
metrics:
  - OA
  - mIoU
  - mF1
  - per_class_IoU
  - per_class_F1
