# Model 2 (U-Net + EfficientNet-B4): train on OpenEarthMap, remapped into the
# CEI 7-class scheme.
#
# The model never sees CEI imagery during training -- CEI is the held-out test
# set (see configs/cei_oem/test/test_m2_uneteffb4_cei.yml), so the result
# measures cross-dataset generalization.
#
# The key line is dataset.label_map: oem_to_cei, which maps OEM's raw 1-8
# codes into CEI's 7 training classes: Bareland and Developed space both ->
# Non-vegetated, every other class 1:1. Routing Developed space to ignore was
# tried and measurably hurt the class it was meant to protect -- see
# src/datasets/taxonomy.py for the numbers.
experiment:
  name: cei_oem_m2_unet_effb4
  output_dir: ./experiments/exp_02_cei_oem_m2_unet_effb4
dataset:
  name: OpenEarthMap
  root: data/OpenEarthMap/OpenEarthMap_wo_xBD
  image_dir: <region>/images
  mask_dir: <region>/labels
  train_split: train_split_60.txt
  val_split: val_split_10.txt
  test_split: test_split_30.txt
  label_map: oem_to_cei     # OEM raw 1-8 -> CEI classes 0-6 (Bareland + Developed space -> Non-vegetated)
  image_size: 512
  crop_size: 512
  original_size: 1024
  num_classes: 7            # 7 real CEI classes; "Unlabeled" is ignore, not a channel
  ignore_index: 255         # internal ignore (CEI stores 0 on disk; loader converts)
  normalization: imagenet
  augment: false            # paper recipe: random crop only
  eval_mode: full           # full-image validation (pad to /32)
model:
  name: unet
  encoder_name: efficientnet-b4
  encoder_weights: imagenet
  in_channels: 3
  num_classes: 7            # must match dataset.num_classes
training:
  batch_size: 8
  epochs: 60
  learning_rate: 0.0001
  optimizer: AdamW
  weight_decay: 0.000001
  loss: cross_entropy
  scheduler: none
  mix_precision: true
  # 0 = load data in the main process. On Windows, num_workers > 0 spawns
  # worker processes that each re-import torch and load its CUDA DLLs (the
  # WinError 1455 "paging file too small" crash), which eats a lot of
  # committed memory on a memory-tight box. Same fix already applied to the
  # IRSA counterpart config and elsewhere in this project.
  num_workers: 0
metrics:
  - OA
  - mIoU
  - mF1
  - per_class_IoU
  - per_class_F1
