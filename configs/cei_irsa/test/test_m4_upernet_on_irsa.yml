# Model 4 (IRSA) in-domain test: UPerNet + Swin-B, IRSA-trained, scored on IRSA's
# own 912-tile test split. The gap between this and test_m4_upernet_on_cei.yml is
# the cross-dataset generalisation cost.
#
#   python evaluate.py --config configs/cei_irsa/test/test_m4_upernet_on_irsa.yml --checkpoint experiments/cei_irsa_m4_upernet_swinb/checkpoints/best_checkpoint.pth --split test --tta
experiment:
  name: cei_irsa_m4_upernet_swinb
  output_dir: ./experiments/cei_irsa_m4_upernet_swinb
dataset:
  name: IRSA_Map
  root: data/IRSAMap
  # IRSA keeps its splits in separate directory trees, so test points at test/.
  image_dir: test/image
  mask_dir: test/SegLabel_vwsbr
  test_split: test_split.txt
  label_map: irsa_to_cei
  nodata_to_ignore: 8       # must match training, or the classes shift
  crop_size: 1024
  num_classes: 7
  ignore_index: 255
  normalization: imagenet
  eval_mode: full
model:
  name: upernet
  encoder_name: tu-swin_base_patch4_window7_224.ms_in22k_ft_in1k
  encoder_params:
    img_size: 1024        # must match the 1024 test tile
  in_channels: 3
  num_classes: 7
training:
  loss: cross_entropy
  num_workers: 4
