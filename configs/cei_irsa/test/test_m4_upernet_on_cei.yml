# Model 4 (IRSA) cross-dataset test: UPerNet + Swin-B, IRSA-trained, scored on
# the 100 CEI tiles. Compare against the OEM-trained UPerNet
# (configs/cei_oem/test/test_m4_upernet_cei.yml).
#
#   python evaluate.py --config configs/cei_irsa/test/test_m4_upernet_on_cei.yml --checkpoint experiments/cei_irsa_m4_upernet_swinb/checkpoints/best_checkpoint.pth --split test --tta
experiment:
  name: cei_irsa_m4_upernet_swinb
  output_dir: ./experiments/cei_irsa_m4_upernet_swinb    # fallback when --output is omitted
dataset:
  name: CEI
  root: data/CEI_data
  # CEI keeps images and masks in two flat folders (no <region> level); mask
  # and image share the same filename: images/maesuai_2.tif -> masks/maesuai_2.tif
  image_dir: images
  mask_dir: masks
  test_split: test_split.txt
  label_map: cei            # CEI ids 1-7 -> classes 0-6; on-disk 0 -> ignore
  crop_size: 1024
  num_classes: 7
  ignore_index: 255
  normalization: imagenet   # must match how the model was trained
  eval_mode: full
model:
  name: upernet
  encoder_name: tu-swin_base_patch4_window7_224.ms_in22k_ft_in1k
  encoder_params:
    # Swin is built for a fixed input size. Test tiles are 1024, not the 512
    # training crop. Swin's weights are resolution-independent, so a 512-trained
    # checkpoint loads here unchanged.
    img_size: 1024
  in_channels: 3
  num_classes: 7
training:
  loss: cross_entropy       # used to report test loss
  num_workers: 4
