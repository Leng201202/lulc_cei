# Model 5 (IRSA) cross-dataset test: SegFormer + MiT-B5, IRSA-trained, scored on
# the 100 CEI tiles. Compare against the OEM-trained SegFormer
# (configs/cei_oem/test/test_m5_segformer_cei.yml).
#
#   python evaluate.py --config configs/cei_irsa/test/test_m5_segformer_on_cei.yml --checkpoint experiments/cei_irsa_m5_segformer_mitb5/checkpoints/best_checkpoint.pth --split test --tta
experiment:
  name: cei_irsa_m5_segformer_mitb5
  output_dir: ./experiments/cei_irsa_m5_segformer_mitb5    # fallback when --output is omitted
dataset:
  name: CEI
  root: data/CEI_data
  # CEI keeps images and masks in two flat folders (no <region> level); mask
  # and image share the same filename: images/maesuai_2.tif -> masks/maesuai_2.tif
  image_dir: images
  mask_dir: masks
  test_split: test_split.txt
  label_map: cei            # CEI ids 1-7 -> classes 0-6; on-disk 0 -> ignore
  crop_size: 1024
  num_classes: 7
  ignore_index: 255
  normalization: imagenet   # must match how the model was trained
  eval_mode: full
model:
  # SegFormer needs no img_size: its MiT encoder has no positional embedding,
  # so 1024 test tiles work with 512-trained weights directly.
  name: segformer
  encoder_name: mit_b5
  in_channels: 3
  num_classes: 7
training:
  loss: cross_entropy       # used to report test loss
  num_workers: 4
