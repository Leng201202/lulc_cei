# Model 4: UPerNet + Swin-B, trained on IRSAMap in the 7-class CEI scheme.
#
# The IRSA counterpart of configs/cei_oem/upernet_swinb_oem2cei.yml. Same model
# and recipe -- only the training data differs, so the two are directly
# comparable on the shared CEI test set.
#
# Swin is built for a fixed 224x224 input and raises "Input height doesn't match
# model" at 512 unless encoder_params.img_size is set to the crop size. If you
# change dataset.crop_size, change encoder_params.img_size to match.
#
# Regenerate the splits with:
#   python tools/irsa/make_splits.py --stratify
experiment:
  name: cei_irsa_m4_upernet_swinb
  output_dir: ./experiments/cei_irsa_m4_upernet_swinb
dataset:
  name: IRSA_Map
  root: data/IRSAMap
  # IRSA uses flat folders with no <region> level. train and val both come from
  # train/; the test split lives in test/ and is covered by its own config.
  image_dir: train/image
  mask_dir: train/SegLabel_vwsbr
  train_split: train_split.txt
  val_split: val_split.txt
  label_map: irsa_to_cei
  # IRSA leaves bareland unannotated, so background (code 0) is real Non-vegetated
  # ground rather than "unlabeled". But ~14% of it is near-black border padding;
  # pixels at or below this brightness are sent to ignore. Set null to disable.
  nodata_to_ignore: 8
  image_size: 512
  crop_size: 512
  original_size: 1024
  num_classes: 7
  ignore_index: 255
  normalization: imagenet
  augment: false
  # crop (not full) for validation: Swin's timm patch_embed hard-asserts the
  # input size equals img_size (512), so full-image 1024 validation crashes.
  # Center-cropping validation to 512 matches the encoder and works on every
  # timm version. Final scoring still uses full 1024 tiles via the test configs
  # (which build the encoder at img_size 1024).
  eval_mode: crop
model:
  name: upernet
  # "tu-" pulls the backbone from timm. This is Swin-B pretrained on ImageNet-22k
  # and fine-tuned on 1k -- the strongest of the three available Swin-B weights.
  encoder_name: tu-swin_base_patch4_window7_224.ms_in22k_ft_in1k
  encoder_weights: imagenet
  encoder_params:
    img_size: 512     # must equal dataset.crop_size and the eval crop size
  in_channels: 3
  num_classes: 7
training:
  # Swin-B is ~97M params vs EfficientNet-B4's ~20M, so the batch is halved to
  # fit alongside full-image validation. Transformers also prefer a lower LR.
  batch_size: 4
  epochs: 100
  learning_rate: 0.00006
  optimizer: AdamW
  weight_decay: 0.01
  loss: cross_entropy
  scheduler: none
  mix_precision: true
  num_workers: 4
metrics:
  - OA
  - mIoU
  - mF1
  - per_class_IoU
  - per_class_F1
