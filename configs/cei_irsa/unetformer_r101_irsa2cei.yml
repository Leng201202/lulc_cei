# Model 3: UNetFormer with a ResNet-101 encoder, trained on IRSAMap in the
# 7-class CEI scheme.
#
# The IRSA counterpart of configs/cei_oem/unetformer_r101_oem2cei.yml. Same model
# and recipe -- only the training data differs, so the two are directly
# comparable on the shared CEI test set.
#
# UNetFormer pairs a CNN encoder with the Global-Local Transformer Block decoder.
# It is deeply supervised: while training it returns (main, aux) and the trainer
# adds the auxiliary loss at training.aux_weight. In eval mode it returns a single
# tensor, so evaluation and prediction are unaffected.
#
# Regenerate the splits with:
#   python tools/irsa/make_splits.py --stratify
experiment:
  name: cei_irsa_m3_unetformer_r101
  output_dir: ./experiments/cei_irsa_m3_unetformer_r101
dataset:
  name: IRSA_Map
  root: data/IRSAMap
  # IRSA uses flat folders with no <region> level. train and val both come from
  # train/; the test split lives in test/ and is covered by its own config.
  image_dir: train/image
  mask_dir: train/SegLabel_vwsbr
  train_split: train_split.txt
  val_split: val_split.txt
  label_map: irsa_to_cei
  # IRSA leaves bareland unannotated, so background (code 0) is real Non-vegetated
  # ground rather than "unlabeled". But ~14% of it is near-black border padding;
  # pixels at or below this brightness are sent to ignore. Set null to disable.
  nodata_to_ignore: 8
  image_size: 512
  crop_size: 512
  original_size: 1024
  num_classes: 7
  ignore_index: 255
  normalization: imagenet
  augment: false
  eval_mode: full
model:
  name: unetformer
  encoder_name: resnet101      # passed straight to timm
  encoder_weights: imagenet    # null trains the encoder from scratch
  decode_channels: 64
  window_size: 8
  dropout: 0.1
  in_channels: 3
  num_classes: 7
training:
  # 43M params -- CNN-scale, so it takes the CNN batch size and learning rate.
  batch_size: 8
  epochs: 200
  learning_rate: 0.0001
  optimizer: AdamW
  weight_decay: 0.000001
  loss: cross_entropy
  aux_weight: 0.4              # weight on the auxiliary head (paper value)
  scheduler: none
  mix_precision: true
  num_workers: 4
metrics:
  - OA
  - mIoU
  - mF1
  - per_class_IoU
  - per_class_F1
