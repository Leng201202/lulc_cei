# Model 5: SegFormer + MiT-B5, trained on IRSAMap in the 7-class CEI scheme.
#
# The IRSA counterpart of configs/cei_oem/segformer_mitb5_oem2cei.yml. Same model
# and recipe -- only the training data differs, so the two are directly
# comparable on the shared CEI test set.
#
# SegFormer pairs a hierarchical Mix Transformer (MiT) encoder with an all-MLP
# decoder -- no positional encoding, so it handles a test resolution different
# from the training crop without any adjustment (no img_size needed).
#
# Regenerate the splits with:
#   python tools/irsa/make_splits.py --stratify
experiment:
  name: cei_irsa_m5_segformer_mitb5
  output_dir: ./experiments/cei_irsa_m5_segformer_mitb5
dataset:
  name: IRSA_Map
  root: data/IRSAMap
  # IRSA uses flat folders with no <region> level. train and val both come from
  # train/; the test split lives in test/ and is covered by its own config.
  image_dir: train/image
  mask_dir: train/SegLabel_vwsbr
  train_split: train_split.txt
  val_split: val_split.txt
  label_map: irsa_to_cei
  # IRSA leaves bareland unannotated, so background (code 0) is real Non-vegetated
  # ground rather than "unlabeled". But ~14% of it is near-black border padding;
  # pixels at or below this brightness are sent to ignore. Set null to disable.
  nodata_to_ignore: 8
  image_size: 512
  crop_size: 512
  original_size: 1024
  num_classes: 7
  ignore_index: 255
  normalization: imagenet
  augment: false
  eval_mode: full
model:
  name: segformer
  encoder_name: mit_b5         # SegFormer's native Mix Transformer backbone
  encoder_weights: imagenet
  in_channels: 3
  num_classes: 7
training:
  # Transformer recipe, matching the two Swin models so the runs differ by
  # architecture rather than by optimiser tuning within each family.
  batch_size: 4
  epochs: 100
  learning_rate: 0.00006
  optimizer: AdamW
  weight_decay: 0.01
  loss: cross_entropy
  scheduler: none
  mix_precision: true
  # 0 = load data in the main process. On Windows, num_workers > 0 makes each
  # worker re-import torch and load its CUDA DLLs; across workers this exhausts
  # the paging file and crashes with WinError 1455. 0 avoids the spawned workers.
  num_workers: 0
metrics:
  - OA
  - mIoU
  - mF1
  - per_class_IoU
  - per_class_F1
