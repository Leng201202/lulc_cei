# โมเดล 5: SegFormer + MiT-B5 เทรนบน IRSAMap แล้ว remap เป็น 7 คลาส CEI
# คู่แฝดของ configs/cei_oem/segformer_mitb5_oem2cei.yml (โมเดล/สูตรเหมือนกัน ต่างแค่ข้อมูล)
# SegFormer = encoder Mix-Transformer + decoder MLP ล้วน ไม่มี positional encoding
# จึงรับภาพเทสต์ขนาดต่างจากตอนเทรนได้เลย (ไม่ต้องตั้ง img_size)
# สร้างไฟล์ split ด้วย:  python tools/irsa/make_splits.py --stratify

experiment:
  name: cei_irsa_m5_segformer_mitb5                      # ชื่อการทดลอง (ตั้งชื่อโฟลเดอร์ผล)
  output_dir: ./experiments/cei_irsa_m5_segformer_mitb5  # โฟลเดอร์เก็บ checkpoint + log
dataset:
  name: IRSA_Map                 # เลือกตัวโหลดข้อมูลของ IRSA
  root: data/IRSAMap             # โฟลเดอร์หลักของข้อมูล
  image_dir: train/image         # โฟลเดอร์รูปภาพสำหรับเทรน
  mask_dir: train/SegLabel_vwsbr # โฟลเดอร์ label(mask) — vwsbr = ถนนทับอาคาร
  train_split: train_split.txt   # ไฟล์รายชื่อ tile ที่ใช้เทรน
  val_split: val_split.txt       # ไฟล์รายชื่อ tile ที่ใช้ validate
  label_map: irsa_to_cei         # แปลงรหัสคลาสของ IRSA -> 7 คลาส CEI
  nodata_to_ignore: 8            # pixel มืด <=8 = ขอบดำ ให้ข้าม
  image_size: 512                # ขนาดภาพที่ใช้
  crop_size: 512                 # ขนาดที่สุ่มครอปตอนเทรน
  original_size: 1024            # ขนาดจริงของ tile ต้นฉบับ
  num_classes: 7                 # จำนวนคลาส (ต้องตรงกับ model)
  ignore_index: 255              # ค่าที่ให้โมเดลข้าม ไม่คิด loss
  normalization: imagenet        # วิธี normalize ภาพ
  augment: false                 # ปิด data augmentation
  eval_mode: full                # ประเมินบนภาพเต็ม (pad ให้หาร 32 ลงตัว)
model:
  name: segformer                # สถาปัตยกรรม: SegFormer
  encoder_name: mit_b5           # backbone = Mix-Transformer B5 (ตัวประจำของ SegFormer)
  encoder_weights: imagenet      # โหลด weight pretrained มาเริ่ม
  in_channels: 3                 # ภาพ RGB 3 ช่อง
  num_classes: 7                 # output 7 คลาส
training:
  batch_size: 4                  # จำนวนภาพต่อรอบ (โมเดลใหญ่ ลดเหลือ 4)
  epochs: 100                    # จำนวนรอบเทรนทั้งหมด
  learning_rate: 0.00006         # อัตราการเรียนรู้ (transformer ชอบค่าต่ำ)
  optimizer: AdamW               # อัลกอริทึมปรับ weight
  weight_decay: 0.01             # ค่าลงโทษ weight กัน overfit (สูตร transformer)
  loss: cross_entropy            # ฟังก์ชัน loss
  scheduler: none                # ไม่ปรับ learning rate ระหว่างเทรน
  mix_precision: true            # ใช้ half-precision (เฉพาะบน CUDA)
  num_workers: 0                 # 0 = โหลดข้อมูลใน process หลัก (ไม่ spawn worker)
                                 # บน Windows ถ้า >0 แต่ละ worker จะโหลด torch DLL ซ้ำ
                                 # จน paging file ไม่พอ -> WinError 1455 ตั้ง 0 กันปัญหานี้
metrics:                         # ตัวชี้วัดที่รายงาน
  - OA                           # Overall Accuracy
  - mIoU                         # mean IoU (ตัวหลักเลือก best checkpoint)
  - mF1                          # mean F1
  - per_class_IoU                # IoU แยกรายคลาส
  - per_class_F1                 # F1 แยกรายคลาส
